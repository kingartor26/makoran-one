<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#ECC665" />
      <stop offset="70%" stop-color="#BF8C2E" />
      <stop offset="100%" stop-color="#9C6B1B" />
    </linearGradient>
    <linearGradient id="iconGold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="40%" stop-color="#D4A237" />
      <stop offset="80%" stop-color="#A16E18" />
      <stop offset="100%" stop-color="#F2CB6E" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g transform="translate(250, 240) scale(1.05)" filter="url(#iconShadow)">
    <!-- Ring -->
    <path d="M -160 -10 A 175 175 0 0 1 160 -10 M 150 90 A 175 175 0 0 1 -150 90" 
          fill="none" stroke="url(#iconGold1)" stroke-width="12" stroke-linecap="round" opacity="0.9" />

    <!-- Center Spire / A -->
    <path d="M -70 120 L -30 -60 Q -10 -150 5 -180 Q 20 -205 38 -208 Q 50 -205 48 -192 Q 44 -175 18 -150 Q -5 -90 10 -60 L 70 120 L 52 120 L 30 70 L -30 70 L -52 120 Z" 
          fill="url(#iconGold1)" />
    <path d="M -24 55 L 0 -45 L 24 55 Z" fill="#0E0F13" />

    <!-- Letter K -->
    <text x="0" y="30" font-family="'Cinzel', 'Georgia', serif" 
          font-size="68" font-weight="bold" fill="url(#iconGold2)" text-anchor="middle">K</text>

    <!-- M Wings -->
    <path d="M -30 -60 Q -90 -20 -115 50 Q -145 130 -195 160 Q -210 168 -225 166 Q -232 163 -232 156 Q -230 148 -210 142 Q -160 125 -140 60 Q -120 -10 -75 -75 Q -45 -120 -10 -150 L 0 -130 Q -40 -70 -30 -60 Z" 
          fill="url(#iconGold2)" />
    <path d="M 30 -60 Q 90 -20 115 50 Q 145 130 195 160 Q 210 168 225 166 Q 232 163 232 156 Q 230 148 210 142 Q 160 125 140 60 Q 120 -10 75 -75 Q 45 -120 10 -150 L 0 -130 Q 40 -70 30 -60 Z" 
          fill="url(#iconGold1)" />

    <!-- House -->
    <path d="M 0 100 L -65 142 L -56 148 L 0 112 L 56 148 L 65 142 Z" fill="url(#iconGold1)" />
    <path d="M -45 142 L -45 165 L -35 165 L -35 149 L 35 149 L 35 165 L 45 165 L 45 142 Z" fill="url(#iconGold2)" />

    <!-- Windows -->
    <g fill="#FFF2A3">
      <rect x="-14" y="138" width="11" height="11" rx="1.5" />
      <rect x="3" y="138" width="11" height="11" rx="1.5" />
      <rect x="-14" y="153" width="11" height="11" rx="1.5" />
      <rect x="3" y="153" width="11" height="11" rx="1.5" />
    </g>

    <!-- Base Underlines -->
    <path d="M -110 165 L -35 165 L -35 170 L -120 170 Z" fill="url(#iconGold2)" />
    <path d="M 110 165 L 35 165 L 35 170 L 120 170 Z" fill="url(#iconGold1)" />
    <path d="M -125 176 L 0 176 L 0 188 L -15 179 L -125 179 Z" fill="url(#iconGold1)" opacity="0.8" />
    <path d="M 125 176 L 0 176 L 0 188 L 15 179 L 125 179 Z" fill="url(#iconGold2)" opacity="0.8" />
  </g>
</svg>
